name: Deploy ws-agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            PROJECT_DIR="${{ secrets.SERVER_PROJECT_PATH }}"
            if [ -z "$PROJECT_DIR" ]; then
              if [ -d "$HOME/ws-agent" ]; then
                PROJECT_DIR="$HOME/ws-agent"
              elif [ -d "/root/ws-agent" ]; then
                PROJECT_DIR="/root/ws-agent"
              else
                PROJECT_DIR="ws-agent"
              fi
            fi

            echo "📂 Target Directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"

            echo "📥 Fetching and pulling latest code..."
            git fetch origin main
            git checkout main
            git pull origin main

            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh
